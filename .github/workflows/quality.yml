name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      GRACE_ADMIN_USERNAME: gracevpaul
      GRACE_ADMIN_PASSWORD_HASH: test-only-placeholder
      GRACE_ADMIN_SESSION_SECRET: 01234567890123456789012345678901
      GRACE_ADMIN_ORIGIN: https://example.com
      GRACE_ADMIN_RP_ID: example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Core regression tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive and security smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
